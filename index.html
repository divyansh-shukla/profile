<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Divyansh Shukla</title>
<meta name="description" content="Divyansh Shukla's personal site is being built. Find me on LinkedIn and GitHub in the meantime.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
<style>
  :root {
    --bg: #f6f7f9;
    --ink: #14213d;
    --muted: #5a6478;
    --line: #d5d9e2;
    --accent: #2f5bea;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1420;
      --ink: #eef1f8;
      --muted: #9aa3b8;
      --line: #28304a;
      --accent: #7c9bff;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    line-height: 1.6;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
  }
  main { width: 100%; max-width: 34rem; }
  h1 {
    font-size: clamp(2.6rem, 9vw, 4.2rem);
    line-height: 1.05;
    font-weight: 600;
    letter-spacing: -0.02em;
    margin: 0 0 1rem;
  }
  .lede { font-size: 1.2rem; color: var(--muted); margin: 0 0 2.25rem; }
  .progress {
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 1.5rem;
  }
  .progress span {
    display: block;
    height: 100%;
    width: 22%;
    background: var(--accent);
    transform-origin: left;
    animation: fill 1.4s ease-out both;
  }
  @keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  ul { list-style: none; margin: 0 0 2.5rem; padding: 0; font-family: system-ui, sans-serif; font-size: 0.95rem; }
  li { display: flex; justify-content: space-between; gap: 1rem; padding: 0.55rem 0; border-bottom: 1px solid var(--line); }
  li span:last-child { color: var(--muted); }
  nav { display: flex; gap: 1.5rem; flex-wrap: wrap; font-family: system-ui, sans-serif; }
  a { color: var(--accent); text-underline-offset: 3px; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
  @media (prefers-reduced-motion: reduce) { .progress span { animation: none; } }
</style>
</head>
<body>
<main>
  <h1>Divyansh Shukla</h1>
  <p class="lede">My new site is under construction. It will have my work, a resume, and an assistant you can ask about me.</p>

  <div class="progress" aria-hidden="true"><span></span></div>
  <ul>
    <li><span>Resume and projects</span><span>In progress</span></li>
    <li><span>Chat assistant</span><span>Planned</span></li>
    <li><span>Book a meeting</span><span>Planned</span></li>
  </ul>

  <nav>
    <!-- TODO: replace the placeholder URLs and email below with your own -->
    <a href="https://www.linkedin.com/in/divyansh-shukla" rel="noopener">LinkedIn</a>
    <a href="https://github.com/divyansh-shukla" rel="noopener">GitHub</a>
    <a href="mailto:you@example.com">Email</a>
  </nav>
</main>
</body>
</html>
